
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#17232B">
    <title>Egypt Digital Guide</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .language-home {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            padding: 40px 20px;
        }

        .home-title {
            font-family: Georgia, serif;
            text-align: center;
            letter-spacing: 2px;
        }

        .language-options {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 45px;
            z-index: 2;
        }

        .language-button {
            display: block;
            padding: 18px;
            text-align: center;
            text-decoration: none;
            border: 1px solid currentColor;
            border-radius: 16px;
            font-size: 22px;
        }

        /* 预留拉美西斯二世流动线条装饰图层 */
        .statue-art-layer {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 40%;
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>

<body>

    <main class="language-home">

        <h1 class="home-title">EGYPT DIGITAL GUIDE</h1>

        <nav class="language-options">
            <a class="language-button" href="sites.html?lang=zh">
                中文
            </a>

            <a class="language-button" href="sites.html?lang=en">
                English
            </a>
        </nav>

        <div
            class="statue-art-layer"
            id="statue-art-layer"
            aria-hidden="true">
        </div>

    </main>

</body>
</html>
